# Drop this inside the existing `server { ... }` block for your HTTPS domain.
# It mounts the app at https://your-domain/voice/ with BASE_PATH=/voice in .env.
location /voice/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;

    # WebSocket upgrade for /voice/ws
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A voice session is one long-lived socket; do not buffer or time it out early.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Optional: redirect the bare prefix so relative asset URLs resolve.
location = /voice {
    return 302 /voice/;
}
