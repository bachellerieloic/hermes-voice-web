<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hermes">
  <title>Hermes Voice</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <style>
    :root {
      --bg: #0b0f1a;
      --fg: #e6edf7;
      --muted: #7c8aa5;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
      --danger: #fb7185;
      --ok: #34d399;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.04em; margin: 0; color: var(--muted); text-transform: uppercase; }
    header .links { display: flex; gap: 14px; }
    header button.link { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 6px 0; cursor: pointer; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; }
    .orb-wrap { position: relative; width: 168px; height: 168px; }
    .orb {
      width: 168px; height: 168px; border-radius: 50%; border: 0; cursor: pointer; position: relative;
      background: radial-gradient(circle at 35% 30%, #1f2a44, #0f1628 70%);
      box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.25), 0 0 40px rgba(125, 211, 252, 0.08);
      transition: box-shadow 0.4s ease, transform 0.2s ease;
    }
    .orb:active { transform: scale(0.97); }
    .orb::after {
      content: ""; position: absolute; inset: 44px; border-radius: 50%;
      background: var(--accent); opacity: 0.25; transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .orb[data-state="idle"]::after { opacity: 0.2; transform: scale(0.8); }
    .orb[data-state="listening"] { box-shadow: 0 0 0 2px rgba(125, 211, 252, 0.55), 0 0 60px rgba(125, 211, 252, 0.18); }
    .orb[data-state="listening"]::after { opacity: 0.55; animation: breathe 2.6s ease-in-out infinite; }
    .orb[data-state="hearing"] { box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.7), 0 0 70px rgba(52, 211, 153, 0.25); }
    .orb[data-state="hearing"]::after { background: var(--ok); opacity: 0.85; transform: scale(1.15); }
    .orb[data-state="thinking"] { box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.6), 0 0 70px rgba(167, 139, 250, 0.22); }
    .orb[data-state="thinking"]::after { background: var(--accent-2); opacity: 0.7; animation: spin 1.4s linear infinite; border-radius: 42%; }
    .orb[data-state="speaking"] { box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.85), 0 0 90px rgba(125, 211, 252, 0.35); }
    .orb[data-state="speaking"]::after { opacity: 0.95; animation: pulse 0.7s ease-in-out infinite; }
    .orb[data-state="error"] { box-shadow: 0 0 0 2px rgba(251, 113, 133, 0.7); }
    .orb[data-state="error"]::after { background: var(--danger); }
    .orb.muted::before {
      content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 120px; margin: -60px 0 0 -2px;
      background: var(--danger); transform: rotate(45deg); border-radius: 2px; z-index: 1;
    }
    @keyframes breathe { 0%, 100% { transform: scale(0.92); } 50% { transform: scale(1.06); } }
    @keyframes pulse { 0%, 100% { transform: scale(0.95); } 50% { transform: scale(1.12); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { color: var(--muted); font-size: 14px; min-height: 20px; }
    #status.error { color: var(--danger); }
    .panel { width: min(640px, 100%); display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    #partial { min-height: 24px; color: var(--fg); font-size: 18px; }
    #partial.tentative { color: var(--muted); font-style: italic; }
    #assistant { min-height: 72px; max-height: 38dvh; overflow-y: auto; white-space: pre-wrap; color: var(--fg); font-size: 16px; -webkit-user-select: text; user-select: text; }
    #assistant .tool { color: var(--accent-2); font-size: 13px; }
    footer { display: flex; justify-content: center; gap: 12px; padding-top: 12px; }
    footer button {
      background: #121a2c; color: var(--fg); border: 1px solid rgba(125, 211, 252, 0.25); border-radius: 999px;
      padding: 10px 18px; font-size: 14px; cursor: pointer; min-width: 120px;
    }
    footer button:disabled { opacity: 0.4; cursor: default; }
    footer button.active { border-color: var(--danger); color: var(--danger); }
    dialog {
      background: #121a2c; color: var(--fg); border: 1px solid rgba(125, 211, 252, 0.25); border-radius: 16px;
      padding: 20px; width: min(420px, calc(100% - 32px)); max-width: none;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
    dialog h2 { margin: 0 0 6px; font-size: 18px; }
    dialog p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
    dialog input {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(125, 211, 252, 0.3);
      background: var(--bg); color: var(--fg); font-size: 16px; margin-bottom: 14px;
    }
    dialog button { background: var(--accent); color: #05101c; border: 0; border-radius: 10px; padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
    .hidden { display: none !important; }
    audio { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Hermes Voice</h1>
    <div class="links">
      <button class="link" id="newConversation" type="button">New conversation</button>
      <button class="link" id="changeToken" type="button">Token</button>
    </div>
  </header>

  <main>
    <div class="orb-wrap">
      <button class="orb" id="orb" data-state="idle" type="button" aria-label="Start talking"></button>
    </div>
    <div id="status">Tap the orb to start</div>
    <section class="panel">
      <div>
        <div class="label">You</div>
        <div id="partial"></div>
      </div>
      <div>
        <div class="label">Hermes</div>
        <div id="assistant"></div>
      </div>
    </section>
  </main>

  <footer>
    <button id="mute" type="button" disabled>Mute</button>
    <button id="stop" type="button" disabled>End session</button>
  </footer>

  <dialog id="tokenDialog">
    <form method="dialog">
      <h2>Voice token</h2>
      <p>Paste the VOICE_TOKEN from the gateway's .env. It stays in this browser only.</p>
      <input id="tokenInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="VOICE_TOKEN">
      <button id="tokenSave" type="submit">Save</button>
    </form>
  </dialog>

  <audio id="loopback" autoplay playsinline></audio>

  <script src="./vad/bundle.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
